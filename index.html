<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRD 교육안내문 만들기 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a6c; --navy2:#2c5f8a; --navy-deep:#13294b;
  --ink:#1a1a1a; --muted:#5b6b80; --line:#e6ebf2;
  --bg:#f4f6f9; --card:#ffffff;
  --blue-soft:#eef3fa; --blue-edge:#2c5f8a;
  --warn-bg:#fff4e0; --warn-edge:#d98200; --warn-ink:#8a5a00;
  --danger-bg:#fdecea; --danger-edge:#c0392b; --danger-ink:#c0392b;
  --ok-bg:#e9f5ee; --ok-edge:#2e8b57; --ok-ink:#1f6b40;
  --sidebar-w:280px;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.7;word-break:keep-all;overflow-wrap:break-word;
  text-align:left;
}
body,body *{text-align:left}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--navy-deep);color:#dce6f3;
  position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;
  z-index:40;transition:transform .28s ease;
}
.sb-brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .kicker{font-size:11px;letter-spacing:.18em;color:#7fa8d6;font-weight:700;text-transform:uppercase}
.sb-brand h1{font-size:18px;font-weight:900;color:#fff;line-height:1.35;margin-top:6px}
.sb-brand p{font-size:11.5px;color:#9fb6d4;margin-top:5px;font-weight:300}

.sb-search{padding:14px 16px}
.sb-search .wrap{position:relative}
.sb-search input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;padding:10px 12px 10px 34px;border-radius:9px;font-size:13px;font-family:inherit;
}
.sb-search input::placeholder{color:#7c93b3}
.sb-search input:focus{outline:none;border-color:#5f8fc9;background:rgba(255,255,255,.12)}
.sb-search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}

.sb-nav{flex:1;overflow-y:auto;padding:4px 10px 24px}
.sb-nav::-webkit-scrollbar{width:7px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:5px}
.nav-group-label{font-size:10.5px;letter-spacing:.12em;color:#6f88aa;font-weight:700;padding:16px 12px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:13.5px;color:#cdd9ea;cursor:pointer;transition:background .15s,color .15s;
  border:none;background:none;width:100%;font-family:inherit;text-align:left;
}
.nav-item .num{font-size:11px;font-weight:700;color:#6f9bcf;min-width:20px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--navy2);color:#fff;font-weight:700}
.nav-item.active .num{color:#bcd6f2}
.nav-sub{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:#9fb6d4;padding:7px 12px 7px 30px;border-radius:7px;
  position:relative;transition:background .15s,color .15s;
}
.nav-sub::before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:#4f6b91}
.nav-sub:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-sub.active{color:#fff;font-weight:700}
.nav-sub.active::before{background:#7fb0e8}

/* ---------- Main ---------- */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0}
.topbar{
  display:none;position:sticky;top:0;z-index:30;background:var(--navy-deep);
  color:#fff;padding:12px 16px;align-items:center;gap:12px;
}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer}
.topbar .t-title{font-size:14px;font-weight:700}

.content{max-width:860px;margin:0 auto;padding:46px 40px 90px}

/* page sections */
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:30px;padding-bottom:22px;border-bottom:2px solid var(--line)}
.page-head .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--navy2);text-transform:uppercase}
.page-head h2{font-size:30px;font-weight:900;color:var(--navy);margin-top:8px;line-height:1.25}
.page-head .lead{font-size:15px;color:var(--muted);margin-top:12px;max-width:62ch}

h3.block-title{font-size:19px;font-weight:800;color:var(--navy);margin:34px 0 14px;display:flex;align-items:center;gap:9px}
h3.block-title .bi{font-size:20px}
h4.sub-title{font-size:15px;font-weight:700;color:var(--navy2);margin:22px 0 10px}

p{font-size:15px;color:#2c3645;margin:10px 0}
.content ul{margin:10px 0 10px 4px;list-style:none}
.content ul li{position:relative;padding-left:20px;margin:7px 0;font-size:14.5px;color:#2c3645}
.content ul li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--navy2)}

/* cards / callouts */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin:16px 0;box-shadow:0 2px 10px rgba(20,41,75,.04)}

.callout{border-radius:12px;padding:15px 18px;margin:16px 0;font-size:14px;border-left:5px solid}
.callout .c-title{font-weight:800;font-size:14px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.callout.info{background:var(--blue-soft);border-color:var(--blue-edge)}
.callout.info .c-title{color:var(--navy)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-edge)}
.callout.warn .c-title{color:var(--warn-ink)}
.callout.warn,.callout.warn p,.callout.warn li{color:var(--warn-ink)}
.callout.danger{background:var(--danger-bg);border-color:var(--danger-edge)}
.callout.danger .c-title{color:var(--danger-ink)}
.callout.danger,.callout.danger p,.callout.danger li{color:#9c2f24}
.callout.ok{background:var(--ok-bg);border-color:var(--ok-edge)}
.callout.ok .c-title{color:var(--ok-ink)}
.callout p{margin:5px 0}
.callout ul li{color:inherit}

/* highlight inline */
mark{background:#fff1b8;padding:1px 5px;border-radius:4px;color:#6b4c00;font-weight:600}
.kbd{display:inline-block;background:#eef1f6;border:1px solid #cdd6e3;border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:600;color:#33415c;font-family:'Noto Sans KR',monospace}
.tag-pill{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-right:4px}

/* 3-step flow */
.flow{display:flex;flex-direction:column;gap:0;margin:20px 0}
.flow-step{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative}
.flow-step .fnum{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.flow-step .ftext b{display:block;font-size:15.5px;color:var(--navy);font-weight:800;margin-bottom:3px}
.flow-step .ftext span{font-size:13.5px;color:var(--muted)}
.flow-arrow{height:22px;display:flex;align-items:center;justify-content:center;color:var(--navy2);font-size:18px;font-weight:700}
.flow-step.optional{border-style:dashed;background:#fafbfd}
.flow-step.optional .fnum{background:var(--navy2);opacity:.75}

/* prompt copy block */
.prompt{background:#0f1f38;border-radius:12px;margin:16px 0;overflow:hidden;border:1px solid #20365c}
.prompt-bar{display:flex;align-items:center;justify-content:space-between;background:#16294a;padding:9px 14px}
.prompt-bar .label{color:#8fb4e0;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.prompt-bar button{background:var(--navy2);color:#fff;border:none;padding:6px 14px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.prompt-bar button:hover{background:#3a73a5}
.prompt-bar button.copied{background:var(--ok-edge)}
.prompt pre{padding:16px 18px;color:#dbe6f5;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;font-family:'Noto Sans KR',sans-serif;max-height:none}

/* numbered steps (github etc) */
ol.steps{counter-reset:s;list-style:none;margin:14px 0}
ol.steps>li{position:relative;padding:4px 0 14px 40px;margin:0;font-size:14.5px;color:#2c3645}
ol.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--navy);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
ol.steps code{background:#eef1f6;padding:2px 7px;border-radius:5px;font-size:13px;color:#c0392b;font-weight:600}

/* guide screenshots */
figure.shot{margin:12px 0 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fbfcfe;box-shadow:0 2px 10px rgba(20,41,75,.05)}
figure.shot img{display:block;width:100%;height:auto}
figure.shot figcaption{font-size:12.5px;color:var(--muted);padding:9px 14px;border-top:1px solid var(--line);background:#fff}
figure.shot figcaption b{color:var(--navy2);font-weight:700}
ol.steps li figure.shot{margin:10px 0 6px}
.shot-tip{font-size:12.5px;color:var(--danger-ink);font-weight:600;margin:2px 0 0}

/* FAQ */
.faq-cat{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.04em;margin:30px 0 12px;padding:8px 14px;background:var(--blue-soft);border-radius:9px;border-left:4px solid var(--navy2)}
.faq-subcat{font-size:12.5px;font-weight:700;color:var(--navy2);margin:18px 0 8px 2px;text-transform:none}
.faq-card{background:var(--card);border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden;transition:box-shadow .18s,border-color .18s}
.faq-card.open{box-shadow:0 4px 16px rgba(20,41,75,.08);border-color:#cbd9ec}
.faq-q{display:flex;align-items:center;gap:11px;padding:15px 18px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink);user-select:none}
.faq-q .q-mark{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.faq-q .q-text{flex:1}
.faq-q .chev{color:var(--navy2);font-size:13px;transition:transform .22s;flex-shrink:0}
.faq-card.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .28s ease}
.faq-a-inner{padding:0 18px 16px 53px;font-size:14px;color:#3a4658;line-height:1.7}
.faq-a-inner .arrow-line{background:var(--blue-soft);border-radius:8px;padding:10px 13px;margin:9px 0;font-size:13.5px;color:var(--navy);border-left:3px solid var(--navy2)}
.faq-a-inner .arrow-line .lab{font-weight:700;color:var(--navy2);display:block;margin-bottom:3px;font-size:12px}
.faq-a-inner small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}

/* search results */
.search-info{background:var(--blue-soft);border-radius:9px;padding:11px 16px;font-size:13.5px;color:var(--navy);margin-bottom:18px;display:none}
.search-info b{font-weight:800}
.hl{background:#fff1b8;color:#6b4c00;border-radius:3px;padding:0 2px}
.no-result{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}

/* search results list */
.sr-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sr-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 18px;cursor:pointer;font-family:inherit;transition:border-color .15s,box-shadow .15s,transform .08s}
.sr-item:hover{border-color:#bcd1ea;box-shadow:0 4px 14px rgba(20,41,75,.08)}
.sr-item:active{transform:translateY(1px)}
.sr-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sr-kind{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--navy2);padding:2px 9px;border-radius:20px;text-transform:uppercase}
.sr-page{font-size:12px;color:var(--muted);font-weight:600}
.sr-title{font-size:15px;font-weight:700;color:var(--navy);line-height:1.4;margin-bottom:4px}
.sr-snip{font-size:13px;color:#55657a;line-height:1.6}
.sr-item mark.hl,.sr-title mark.hl{background:#fff1b8;color:#6b4c00;padding:0 3px;border-radius:3px}

.faq-card.search-hidden{display:none}
.faq-cat.search-hidden,.faq-subcat.search-hidden{display:none}
#faqWrap .callout.search-hidden{display:none}

/* footer note */
.end-banner{margin-top:46px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:var(--radius);padding:30px 28px;text-align:center}
.end-banner h3{color:#fff;font-size:20px;font-weight:900;margin-bottom:6px}
.end-banner p{color:#cfe0f5;font-size:14px}

/* prep files row */
.file-row{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.file-chip{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.file-chip .fc-ico{font-size:22px;margin-bottom:8px}
.file-chip b{display:block;color:var(--navy);font-size:14.5px;font-weight:800;margin-bottom:4px}
.file-chip span{font-size:13px;color:var(--muted)}

/* responsive */
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:35}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar{display:flex}
  .backdrop.show{display:block}
  .content{padding:28px 20px 70px}
  .page-head h2{font-size:24px}
  .flow-step{padding:15px 16px}
  .file-chip{min-width:100%}
}

/* ===== mobile robustness (additive only) ===== */
/* prevent any wide child from causing horizontal page scroll */
html,body{max-width:100%;overflow-x:hidden}
/* media never overflows its container */
.content img,figure.shot img{max-width:100%;height:auto}
/* long words / URLs in copy blocks wrap instead of pushing layout wide */
.prompt pre{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* dynamic viewport height so mobile browser chrome doesn't clip sidebar */
@supports(height:100dvh){
  .sidebar{height:100dvh}
}

@media(max-width:900px){
  /* comfortable tap targets for touch */
  .nav-item{padding-top:11px;padding-bottom:11px}
  .nav-sub{padding-top:10px;padding-bottom:10px}
  .faq-q{padding-top:16px;padding-bottom:16px}
  .topbar button{width:42px;height:42px}
  /* prompt bar copy button stays reachable, wraps gracefully */
  .prompt-bar{flex-wrap:wrap;gap:8px}
  .prompt-bar .label{min-width:0;overflow-wrap:anywhere}
  /* search results meta wraps on narrow widths */
  .sr-meta{flex-wrap:wrap}
}

@media(max-width:480px){
  .content{padding:22px 15px 64px}
  /* iOS zooms inputs under 16px on focus; keep at 16px to avoid auto-zoom */
  .sb-search input{font-size:16px}
  /* tighter flow steps on very small screens, layout unchanged */
  .flow-step{padding:14px 14px;gap:13px}
  .flow-step .fnum{width:38px;height:38px;font-size:16px}
  /* prompt block padding eased so text isn't cramped */
  .prompt pre{padding:14px 14px}
  .prompt-bar{padding:8px 12px}
  /* numbered steps indent fits narrow screens */
  ol.steps>li{padding-left:36px}
  /* sidebar slightly narrower so a sliver of content shows behind it */
  .sidebar{width:min(var(--sidebar-w),86vw)}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="kicker">KIRD GUIDE</div>
      <h1>교육안내문 만들기 가이드</h1>
      <p>생성형 AI로 쉽게 안내문 만들기</p>
      <p>최종 업데이트(ver.1.1) : 2026. 6. 17.</p>
    </div>
    <div class="sb-search">
      <div class="wrap">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="가이드 검색 (예: 셔틀, 환불, 사진)" autocomplete="off">
      </div>
    </div>
    <nav class="sb-nav" id="navList"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button id="menuBtn" aria-label="메뉴 열기">☰</button>
      <span class="t-title">교육안내문 만들기 가이드</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<script>
/* ============================================================
   KIRD 교육안내문 가이드 — 콘텐츠 데이터 & 렌더링
   txt 원문을 그대로 담되, 시각화/강조 처리.

      {q:"환불 기준은 매번 똑같던데 또 적어야 하나요?", a:"기관 표준 문구가 있으면 그대로 두고 재사용하면 됩니다. 과정마다 다른 부분만 고치면 됩니다."},
      {q:"‘수료 관련 강조 경고’는 뭔가요?", a:"미수료 시 통보처럼 꼭 짚어야 할 내용을 빨간 박스로 강조하는 칸입니다. 없으면 비워 두세요."},
    ]},
    { name:"오시는 길 / 교통", items:[
      {q:"교통수단(승용차·버스·기차·셔틀)을 다 적어야 하나요?", a:"아니요. 해당하는 것만 적고 나머지는 비우면 됩니다. 비운 교통수단은 안내문에 나오지 않습니다."},
      {q:"셔틀버스를 운영하지 않아요.", a:"셔틀버스 항목을 통째로 비우면 됩니다. 안내문에서 빠집니다."},
      {q:"주차 안내나 강조문구는 어떻게 넣나요?", a:"양식의 ‘강조문구’ 칸에 적으면 붉은 박스로 강조 표시됩니다."},
    ]},
    { name:"시설 안내", items:[
      {q:"비숙박 교육인데 시설 안내가 필요 없어요.", a:"시설 항목을 비워 두면 영역 전체가 안 나옵니다. (비숙박용 양식을 쓰면 더 깔끔합니다)"},
      {q:"시설(교육장·식당·숙소 등)이 4개보다 많거나 적으면요?", a:"시설 묶음을 복사해 늘리거나 지우면 됩니다. 적은 개수만큼 표시됩니다."},
    ]},
    { name:"참여방법 (실시간 온라인 교육)", items:[
      {q:"실시간 온라인 교육이에요. 어떤 양식을 써야 하나요?", a:"‘실시간 온라인용’ 디자인 양식(html)과 입력양식(txt)을 사용하시면 됩니다. 이 양식은 오프라인 양식과 거의 같지만, 오프라인에 있던 ‘오시는 길/교통’과 ‘시설 안내’ 자리가 ‘참여방법’으로 바뀌어 있습니다. 그래서 실시간 온라인 교육에 맞는 접속 안내를 자연스럽게 담을 수 있습니다."},
      {q:"접속 링크(Zoom 등)는 어떻게 넣나요?", a:"‘참여방법’의 접속 링크 칸에 주소를 적으면 안내문에 ‘접속하기’ 버튼이 표시됩니다. 링크를 비워 두면 버튼 없이 안내 문구만 나옵니다. 보안 등의 이유로 회의 ID·비밀번호를 미리 공개하지 않고 추후 문자나 메일로 보내는 경우라면, 링크 칸을 비우고 ‘회의 ID와 비밀번호는 추후 문자 및 메일로 전송됩니다’ 같은 문구만 넣어 두시면 됩니다."},
      {q:"접속 테스트나 접속 오류 안내도 꼭 넣어야 하나요?", a:"필수는 아니지만 넣어 두시길 권장합니다. 실시간 온라인 교육은 접속 문제가 자주 생기기 때문입니다. 칸을 비우면 해당 강조 박스가 표시되지 않고, 채우면 눈에 띄는 박스로 표시됩니다. 예를 들어 ‘원활한 진행을 위해 교육 첫날 00:00~00:00에 입장하여 화면과 음향을 확인해 주시기 바랍니다’, ‘접속 오류 발생 시 KIRD 운영진에게 연락 주시기 바랍니다’처럼 적으면 됩니다."},
      {q:"실시간 온라인 교육인데 ‘장소’ 칸은 어떻게 하나요?", a:"실시간 온라인용 양식에서는 과정개요의 ‘장소’가 ‘교육방식’으로 되어 있습니다. 여기에 ‘실시간 온라인(Zoom)’처럼 어떤 방식으로 진행되는지를 적으시면 됩니다. 별도의 물리적 장소를 적지 않아도 됩니다."},
      {q:"‘유의사항’과 ‘학습자용 저작권 가이드’는 무엇인가요?", a:"실시간 온라인용 양식에 기본으로 포함된 항목입니다. ‘유의사항’에는 강의 자료·접속 URL을 다른 사람과 공유하지 않기, 강의 녹화·캡처 금지 같은 내용이 들어가고, ‘학습자용 저작권 가이드’에는 강의자료의 저작권·초상권·개인정보 보호 관련 안내가 담겨 있습니다. 기본 문구가 채워져 있으니 우리 과정에 맞게 수정하거나, 필요 없으면 비워 두시면 됩니다."},
    ]},
    { name:"문의처", items:[
      {q:"담당자가 1명뿐이에요 / 더 많아요.", a:"담당자 줄을 지우거나 복사해 인원수를 맞추면 됩니다."},
    ]},
  ]},

  { cat:"C. AI 사용 중 오류 — 이렇게 대처하세요", intro:{
      title:"⭐ 가장 중요한 요령 — 말로만 설명하지 말고 ‘보여 주세요’",
      desc:"AI는 글로만 설명하면 상황을 잘못 이해할 때가 많습니다. 다음을 함께 주면 훨씬 정확하게 고쳐 줍니다.",
      points:[
        ["잘못된 부분을 화면 캡처(스크린샷)해서 첨부하기","안내문을 열어 이상한 부분이 보이는 화면을 캡처한 뒤, “이 캡처의 빨간 동그라미 부분이 잘못됐어. 고쳐 줘.”처럼 어디가 문제인지 짚어 주세요. (윈도우: 윈도우키+Shift+S / 맥: command+shift+4 로 캡처)"],
        ["잘 됐던 예시 파일을 함께 첨부하기","“이 파일처럼 만들어 줘. 이건 잘 된 예시야.”라고 하면 AI가 그 모양을 기준으로 맞춰 줍니다."],
        ["원하는 결과를 글·그림으로 설명하기","“표가 이렇게 두 칸으로 나뉘면 좋겠어”처럼 구체적으로."],
      ],
      summary:"요약: 캡처 + 예시 파일 + 구체적인 설명 = 가장 빠른 해결"
    },
    sub:[
    { name:"결과물이 이상할 때", items:[
      {q:"완성된 파일을 열었더니 빈 화면이거나 디자인이 깨졌어요.", a:"AI가 코드 일부를 빠뜨렸을 가능성이 큽니다. 이렇게 요청하세요.", arrow:"안내문이 빈 화면으로 열려. 코드가 중간에 잘린 것 같으니 처음부터 끝까지 완전한 HTML 파일로 다시 만들어 줘.", small:"깨진 화면을 캡처해 함께 주면 더 정확히 고쳐 줍니다. 그래도 안 되면, 새 대화를 열고 STEP 2부터 다시 하세요."},
      {q:"글자(한글)가 □□□나 외계어처럼 깨져 보여요.", a:"파일 인코딩 문제일 수 있습니다.", arrow:"한글이 깨지지 않게 UTF-8 인코딩으로 다시 저장해 줘.", small:"직접 고칠 때는, 메모장의 [다른 이름으로 저장]에서 인코딩을 ‘UTF-8’로 지정해 저장하세요."},
      {q:"답변이 중간에 뚝 끊기고 멈췄어요.", a:"한 번에 만들 수 있는 양을 넘었기 때문입니다.", arrow:"이어서 계속해 줘", small:"그래도 자꾸 끊기면 “안내문을 한 파일로 완성해서 파일로 내려받게 해 줘”라고 요청하거나, 유료 버전/다른 AI를 사용해 보세요."},
      {q:"내가 적지도 않은 내용이 안내문에 들어가 있어요.", a:"AI가 임의로 지어낸(환각) 경우입니다.", arrow:"입력 양식(txt)에 있는 내용만 사용하고, 내가 적지 않은 내용은 절대 만들어 넣지 마. 빈 항목은 생략해 줘.", small:"완성 후에는 날짜·금액·이름·전화번호를 꼭 직접 검토하세요."},
      {q:"비워 둔 항목인데 ‘세션’, ‘예시’ 같은 안내 문구가 그대로 나와요.", a:"예시 문구가 지워지지 않은 경우입니다.", arrow:"입력값이 없는 항목의 예시 문구(예: ‘세션’,‘안내’,‘예시’)는 모두 빼고, 그 영역과 빈 공백도 함께 없애 줘."},
      {q:"빈 항목 자리에 큰 여백(빈 공간)이 생겼어요.", a:"", arrow:"내용이 없는 영역은 제목·박스·여백까지 모두 없애고, 위아래가 자연스럽게 붙도록 레이아웃을 정리해 줘."},
    ]},
    { name:"디자인이 바뀌었을 때", items:[
      {q:"내용은 맞는데 디자인(색·글꼴·모양)이 바뀌어 버렸어요.", a:"", arrow:"디자인·색상·글꼴·레이아웃은 원래 양식 그대로 두고, 내용만 바꿔 줘. 디자인은 절대 변경하지 마.", small:"원본 디자인 양식(또는 잘 나왔던 안내문)을 다시 첨부하면서 “이 파일의 디자인 그대로 맞춰 줘”라고 하면 더 정확합니다."},
      {q:"휴대폰에서 보니 글자가 너무 크거나 레이아웃이 깨져요.", a:"", arrow:"모바일(휴대폰) 화면에서도 깨지지 않게 반응형으로 만들어 줘.", small:"휴대폰에서 깨진 화면을 캡처해 첨부하면 어느 부분이 문제인지 AI가 정확히 파악합니다."},
    ]},
    { name:"사진 문제", items:[
      {q:"사진을 첨부했는데 안내문에 안 들어갔어요.", a:"어느 자리에 넣을지 콕 집어 요청하세요.", arrow:"방금 첨부한 사진을 ‘오시는 길’ 사진 칸에 넣어서 다시 만들어 줘."},
      {q:"사진이 엉뚱한 자리에 들어갔어요.", a:"파일 이름과 위치를 함께 알려 주세요.", arrow:"‘탑승지1.jpg’는 첫 번째 탑승지 칸에, ‘탑승지2.jpg’는 두 번째 탑승지 칸에 넣어 줘."},
      {q:"사진을 넣었더니 파일이 너무 무거워졌어요 / 느려요.", a:"사진 용량이 큰 경우입니다. 두 가지 방법이 있습니다. ① 만들 때 미리: 프롬프트의 ‘사진 처리’에 적힌 대로 “가로 1200픽셀 이내, 한 장당 300KB 이하로 압축해서 넣어 줘”라고 요청하면 AI가 줄여서 넣어 줍니다. ② 사진을 직접 줄이기: 그림판·사진 앱에서 가로 1200픽셀 정도로 줄인 뒤 다시 첨부하세요.", small:"AI가 압축을 충분히 못 할 때도 있으니, 파일이 계속 무거우면 ②번처럼 사진을 직접 줄이는 것이 가장 확실합니다."},
    ]},
    { name:"파일·업로드 문제", items:[
      {q:"파일이 커서 업로드가 안 돼요.", a:"사진을 뺀 상태로 먼저 안내문을 만든 뒤, 사진은 ‘STEP 3’에서 따로 넣어 달라고 나눠서 요청하세요."},
      {q:"AI가 파일을 못 읽는다고 해요.", a:"파일을 다시 첨부하거나, txt 내용을 복사해서 대화창에 직접 붙여넣어 보세요. 파일 형식(txt, html)이 맞는지도 확인하세요."},
    ]},
    { name:"대화가 꼬일 때", items:[
      {q:"고쳐 달라고 할수록 점점 이상해져요.", a:"대화가 길어지면 AI가 앞 내용을 잊습니다. 새 대화를 열고, ‘가장 잘 나왔던 HTML 파일’을 다시 첨부한 뒤 거기서부터 고쳐 달라고 하세요."},
      {q:"여러 번 고쳤더니 어떤 게 최신인지 모르겠어요.", a:"잘 된 버전이 나올 때마다 파일을 저장하고, 이름에 날짜나 번호를 붙여 두세요. (예: 안내문_v1, 안내문_v2)"},
      {q:"AI가 내 요청을 자꾸 다르게 이해해요.", a:"한 번에 한 가지씩, 구체적으로 요청하세요. (X) “이상한 데 좀 고쳐 줘” → (O) “문의처에서 ‘홍길동’ 줄을 지워 줘”"},
    ]},
    { name:"모바일에서 작동이 안 될 때", items:[
      {q:"휴대폰에서 화면은 보이는데 탭이 눌리지 않아요.", a:"모바일 파일뷰어나 일부 브라우저에서 JavaScript 탭 기능이 제한되어 생기는 문제일 수 있습니다. 완성된 HTML 파일을 다시 AI에 첨부하고 아래처럼 요청하세요.", arrow:"첨부한 HTML 파일은 PC에서는 보이지만, 모바일에서 상단 탭이나 Day 탭을 눌러도 내용이 바뀌지 않습니다. 디자인·색상·폰트·내용은 그대로 유지하고, 모바일에서도 탭 전환이 정상 작동하도록 코드만 수정해 주세요. onclick JavaScript에만 의존하지 말고, label + radio input 방식 또는 JavaScript가 제한되어도 작동 가능한 방식으로 보완해 주세요. 최종 결과는 하나의 HTML 파일로 다시 제공해 주세요."},
    ]},
    { name:"그래도 안 될 때", items:[
      {q:"무엇을 해도 해결이 안 돼요.", a:"다음을 순서대로 시도하세요. ① 새 대화창에서 STEP 2부터 다시 (가장 깔끔한 방법) ② 다른 생성형 AI로 바꿔서 시도 ③ 마지막으로 잘 됐던 HTML 파일을 기준으로 조금씩만 수정 ④ 그래도 안 되면 담당 부서/동료에게 파일과 함께 문의"},
    ]},
  ]},

  { cat:"D. GitHub(링크 공유) 관련", items:[
    {q:"GitHub Pages 주소(URL)가 생성되지 않아요.", a:"다음 사항을 확인하세요. □ 저장소가 Public(공개) 상태인지 □ Settings → Pages에서 Pages 기능이 활성화되어 있는지 □ Branch가 main으로 설정되어 있는지 □ index.html 파일이 저장소 최상위 폴더에 있는지. 설정을 변경한 경우에는 1~5분 정도 기다린 후 다시 확인하세요."},

/* ====== helper: screenshot figure ====== */
function shot(key, caption, tip){
  return `<figure class="shot">
    <img src="${IMG[key]}" alt="${caption||''}" loading="lazy">
    ${caption?`<figcaption>${caption}${tip?`<div class="shot-tip">🔴 ${tip}</div>`:""}</figcaption>`:""}
  </figure>`;
}

/* ====== helper: prompt block ====== */
function promptBlock(label, text){
  const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const id = "p"+Math.random().toString(36).slice(2,8);
  return `<div class="prompt">
    <div class="prompt-bar">
      <span class="label">📋 ${label}</span>
      <button onclick="copyPrompt('${id}',this)">복사하기</button>
    </div>
    <pre id="${id}">${esc}</pre>
  </div>`;
}

/* ====== helper: faq card html ====== */
function faqCard(item){
  let inner = item.a ? `<p style="margin:0">${item.a}</p>` : "";
  if(item.arrow){
    inner += `<div class="arrow-line"><span class="lab">이렇게 요청하세요 (복사해서 사용)</span>${item.arrow}</div>`;
  }
  if(item.small){
    inner += `<small>※ ${item.small}</small>`;
  }
  const hay = (item.q + " " + (item.a||"") + " " + (item.arrow||"") + " " + (item.small||"")).toLowerCase();
  return `<div class="faq-card" data-hay="${hay.replace(/"/g,'&quot;')}">
    <div class="faq-q" onclick="toggleFaq(this)">
      <span class="q-mark">Q</span>
      <span class="q-text">${item.q}</span>
      <span class="chev">▼</span>
    </div>
    <div class="faq-a"><div class="faq-a-inner">${inner}</div></div>
  </div>`;
}

/* ====== build FAQ page body ====== */
function buildFaqBody(){
  let html = `<div class="search-info" id="searchInfo"></div><div id="faqWrap">`;
  FAQ.forEach((group,gi)=>{
    html += `<div class="faq-cat" id="faqcat-${gi}">${group.cat}</div>`;
    // C 카테고리 도입부 (★보여 주세요)
    if(group.intro){
      const I = group.intro;
      let pts = I.points.map(p=>`<li><b>${p[0]}</b><br><span style="color:#9c2f24">${p[1]}</span></li>`).join("");
      html += `<div class="callout danger" data-hay="${(I.title+I.desc+I.points.map(p=>p[0]+p[1]).join(" ")).toLowerCase().replace(/"/g,'&quot;')}">
        <div class="c-title">${I.title}</div>
        <p>${I.desc}</p>
        <ul>${pts}</ul>
        <p style="font-weight:700;margin-top:10px">※ ${I.summary}</p>
      </div>`;
    }
    if(group.items){
      group.items.forEach(it=> html += faqCard(it));
    }
    if(group.sub){
      group.sub.forEach(s=>{
        html += `<div class="faq-subcat">— ${s.name} —</div>`;
        s.items.forEach(it=> html += faqCard(it));
      });
    }
    if(group.safe){
      let lis = group.safe.map(t=>`<li>${t}</li>`).join("");
      html += `<div class="callout ok" data-hay="${group.safe.join(" ").toLowerCase().replace(/"/g,'&quot;')}"><div class="c-title">🛡️ 안전 수칙</div><ul>${lis}</ul></div>`;
    }
  });
  html += `</div><div class="no-result" id="noResult" style="display:none">검색 결과가 없습니다. 다른 키워드로 찾아보세요.</div>`;
  return html;
}

const FAQ_NAV = [
  "A. 시작 전 기본 궁금증",
  "B. 입력 양식 작성",
  "C. AI 오류 대처",

/* ====== RENDER NAV ====== */
function renderNav(){
  const nav = document.getElementById("navList");
  let html = "", lastGroup = "";
  PAGES.forEach(p=>{
    if(p.group !== lastGroup){
      html += `<div class="nav-group-label">${p.group}</div>`;
      lastGroup = p.group;
    }
    html += `<button class="nav-item" data-id="${p.id}" onclick="showPage('${p.id}')">
      <span class="num">${p.num||"•"}</span><span>${p.nav}</span>
    </button>`;
    // FAQ 페이지 바로 아래에 카테고리 하위 네비 삽입
    if(p.isFaq){
      FAQ_NAV.forEach((label,gi)=>{
        html += `<button class="nav-sub" data-faqcat="${gi}" onclick="goToFaqCat(${gi})">${label}</button>`;
      });
    }
  });
  nav.innerHTML = html;
}

/* FAQ 특정 카테고리로 이동 */
function goToFaqCat(gi){
  showPage("faq");
  // 검색 중이면 초기화 (숨겨진 항목 복구)
  const si=document.getElementById("searchInput");
  if(si && si.value){ si.value=""; runSearch(""); }
  setTimeout(()=>{
    const el = document.getElementById("faqcat-"+gi);
    if(el){
      const c = document.querySelector(".content");
      // 데스크탑은 window 스크롤, 모바일도 동일
      el.scrollIntoView({behavior:"smooth", block:"start"});
    }
    document.querySelectorAll(".nav-sub").forEach(n=>n.classList.toggle("active", +n.dataset.faqcat===gi));
    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  }, 60);
  closeSidebar();
}

/* ====== RENDER CONTENT ====== */
function renderContent(){
  const c = document.getElementById("content");
  let html = "";
  PAGES.forEach(p=>{
    const inner = p.isFaq ? buildFaqBody() : p.body;
    html += `<section class="page" id="page-${p.id}">

function endBanner(){
  return `<div class="end-banner"><h3>끝까지 따라오셨습니다 🎉</h3><p>이제 직접 만들어 보세요!</p></div>`;
}

/* ====== PAGE SWITCH ====== */
function showPage(id){
  window.__lastPage = id;
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  const sr=document.getElementById("searchResults"); if(sr) sr.style.display="none";
  const pg = document.getElementById("page-"+id);
  if(pg) pg.classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.id===id));
  document.querySelectorAll(".nav-sub").forEach(n=>n.classList.remove("active"));
  document.querySelector(".content").scrollTo?.(0,0);
  window.scrollTo(0,0);
  document.getElementById("content").scrollIntoView?.({block:"start"});
  closeSidebar();
}

/* ====== FAQ TOGGLE ====== */
function toggleFaq(q){
  const card = q.closest(".faq-card");
  const ans = card.querySelector(".faq-a");
  const open = card.classList.toggle("open");
  ans.style.maxHeight = open ? ans.firstElementChild.scrollHeight + 32 + "px" : "0";
}

/* ====== COPY PROMPT ====== */
function copyPrompt(id, btn){
  const txt = document.getElementById(id).innerText;
  const done = ()=>{ btn.textContent="복사됨 ✓"; btn.classList.add("copied"); setTimeout(()=>{btn.textContent="복사하기";btn.classList.remove("copied");},1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else { fallbackCopy(txt, done); }
}
function fallbackCopy(txt, cb){
  const ta=document.createElement("textarea"); ta.value=txt;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); cb();
}

/* ====== SEARCH (전체 페이지 통합 검색) ======
   - 대소문자 구분 없음, 부분 문자열 매칭
   - 본문 페이지 + FAQ 모두 검색
*/
let SEARCH_INDEX = null;

function buildSearchIndex(){
  // 각 페이지의 렌더된 텍스트를 수집
  const idx = [];
  PAGES.forEach(p=>{
    const sec = document.getElementById("page-"+p.id);
    if(!sec) return;
    if(p.isFaq){
      // FAQ: 카드/콜아웃 단위로 세분화
      sec.querySelectorAll(".faq-card").forEach(card=>{
        const qel = card.querySelector(".q-text");
        const ael = card.querySelector(".faq-a-inner");
        idx.push({
          pageId:p.id, pageNav:p.nav, kind:"FAQ",
          title: qel?qel.innerText.trim():"",
          text: ((qel?qel.innerText:"")+" "+(ael?ael.innerText:"")).trim(),
          anchor: card
        });
      });
      sec.querySelectorAll("#faqWrap > .callout").forEach(co=>{
        const t = co.querySelector(".c-title");
        idx.push({
          pageId:p.id, pageNav:p.nav, kind:"FAQ",
          title: t?t.innerText.trim():"안내",
          text: co.innerText.trim(),
          anchor: co
        });
      });
    } else {
      // 본문 페이지: 페이지 전체를 하나의 항목으로 (프롬프트 코드 포함)
      const head = sec.querySelector(".page-head");
      const clone = sec.cloneNode(true);
      idx.push({
        pageId:p.id, pageNav:p.nav, kind:p.eyebrow||"본문",
        title: p.title,
        text: sec.innerText.trim(),
        anchor: sec
      });
    }
  });
  return idx;
}

function runSearch(raw){
  const q = raw.trim().toLowerCase();
  const info = document.getElementById("searchInfo");
  const noRes = document.getElementById("noResult");
  const resultsPage = document.getElementById("searchResults");

  // 검색어 없음 → 검색결과 영역 숨기고 원상복구
  if(!q){
    if(resultsPage) resultsPage.style.display="none";
    // FAQ 필터 해제
    document.querySelectorAll("#faqWrap .faq-card, #faqWrap .callout").forEach(el=>{ el.classList.remove("search-hidden"); clearHL(el); });
    document.querySelectorAll(".faq-cat,.faq-subcat").forEach(el=>el.classList.remove("search-hidden"));
    if(info) info.style.display="none";
    if(noRes) noRes.style.display="none";
    // 현재 활성 페이지 유지 (검색 전 마지막 페이지)
    if(resultsPage && resultsPage.classList.contains("active")){
      showPage(window.__lastPage||"intro");
    }
    return;
  }

  if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();

  // 매칭
  const hits = SEARCH_INDEX.filter(it=> it.text.toLowerCase().includes(q));

  // 검색 결과 전용 페이지로 전환
  if(!document.getElementById("page-faq").classList.contains("active")){
    // 마지막 페이지 기억 (검색결과 페이지가 아닐 때만)
  }
  showSearchResults(raw.trim(), q, hits);
}

function showSearchResults(rawTrim, q, hits){
  // 검색결과 페이지 보장
  let rp = document.getElementById("searchResults");
  if(!rp){
    rp = document.createElement("section");
    rp.className="page"; rp.id="searchResults";
    document.getElementById("content").appendChild(rp);
  }
  // 활성 페이지 전환
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  rp.classList.add("active");
  rp.style.display="block";
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelectorAll(".nav-sub").forEach(n=>n.classList.remove("active"));

  let html = `<div class="page-head">
      <div class="eyebrow">검색</div>
      <h2>“${escapeHtml(rawTrim)}” 검색 결과</h2>
      <p class="lead">전체 가이드에서 <b>${hits.length}건</b>을 찾았습니다. 항목을 클릭하면 해당 위치로 이동합니다.</p>
    </div>`;

  if(hits.length===0){
    html += `<div class="no-result">검색 결과가 없습니다. 다른 키워드로 찾아보세요.<br><span style="font-size:13px">예: 셔틀, 환불, PPT, GitHub, 사진, 모바일</span></div>`;
  } else {
    html += `<div class="sr-list">`;
    hits.forEach((h,i)=>{
      html += `<button class="sr-item" onclick="gotoHit(${i})">
        <div class="sr-meta"><span class="sr-kind">${escapeHtml(h.kind)}</span><span class="sr-page">${escapeHtml(h.pageNav)}</span></div>
        <div class="sr-title">${markText(h.title,q)}</div>
        <div class="sr-snip">${snippet(h.text,q)}</div>
      </button>`;
    });
    html += `</div>`;
  }
  rp.innerHTML = html;
  window.__lastHits = hits;
  window.__lastQ = q;
  window.scrollTo(0,0);
  closeSidebar();
}

/* 검색 결과 항목 클릭 → 해당 페이지로 이동 + 위치 스크롤 + 하이라이트 */
function gotoHit(i){
  const hits = window.__lastHits||[];
  const h = hits[i]; if(!h) return;
  const q = window.__lastQ||"";
  // 검색창 비우기 (원래 페이지 보기 위해)
  const si=document.getElementById("searchInput");
  // FAQ 필터가 걸리지 않도록 먼저 검색결과 페이지 닫기
  const rp=document.getElementById("searchResults"); if(rp){rp.classList.remove("active");rp.style.display="none";}
  si.value="";
  // FAQ 항목 복구
  document.querySelectorAll("#faqWrap .faq-card, #faqWrap .callout").forEach(el=>{ el.classList.remove("search-hidden"); clearHL(el); });
  document.querySelectorAll(".faq-cat,.faq-subcat").forEach(el=>el.classList.remove("search-hidden"));

  showPage(h.pageId);
  setTimeout(()=>{
    const a = h.anchor;
    if(a){
      // FAQ 카드면 펼치기
      if(a.classList.contains("faq-card") && !a.classList.contains("open")){
        const qd=a.querySelector(".faq-q"); if(qd) toggleFaq(qd);
      }
      highlight(a,q);
      a.scrollIntoView({behavior:"smooth", block:"center"});
      a.style.transition="box-shadow .3s"; a.style.boxShadow="0 0 0 3px rgba(44,95,138,.45)";
      setTimeout(()=>{ a.style.boxShadow=""; }, 1800);
    }
  }, 80);
}

/* 매칭 부분 강조한 짧은 스니펫 */
function snippet(text, q){
  const low=text.toLowerCase();
  let pos=low.indexOf(q);
  if(pos<0) return escapeHtml(text.slice(0,90))+"…";
  const start=Math.max(0,pos-35), end=Math.min(text.length,pos+q.length+55);
  let s=(start>0?"…":"")+text.slice(start,end)+(end<text.length?"…":"");
  return markText(s,q);
}
function markText(text,q){
  if(!q) return escapeHtml(text);
  const parts=text.split(new RegExp("("+escapeReg(q)+")","gi"));
  return parts.map(p=> p.toLowerCase()===q ? `<mark class="hl">${escapeHtml(p)}</mark>` : escapeHtml(p)).join("");
}

function highlight(el,q){
  clearHL(el);
  const walker=document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const targets=[];
  while(walker.nextNode()){
    const n=walker.currentNode;
    if(n.parentElement.closest(".prompt")) continue;
    if(n.nodeValue.toLowerCase().includes(q)) targets.push(n);
  }
  targets.forEach(n=>{
    const span=document.createElement("span");
    const parts=n.nodeValue.split(new RegExp("("+escapeReg(q)+")","gi"));
    parts.forEach(part=>{
      if(part.toLowerCase()===q){ const m=document.createElement("mark"); m.className="hl"; m.textContent=part; span.appendChild(m); }
      else span.appendChild(document.createTextNode(part));
    });
    n.parentNode.replaceChild(span,n);
  });
}
function clearHL(el){
  el.querySelectorAll("span > mark.hl").forEach(m=>{
    const span=m.parentElement;
    if(span && span.tagName==="SPAN"){ span.replaceWith(document.createTextNode(span.textContent)); }
  });
  // normalize 잔여 span
  el.querySelectorAll("mark.hl").forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ====== SIDEBAR (mobile) ====== */
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("backdrop").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("backdrop").classList.remove("show"); }

/* ====== INIT ====== */
function init(){
  renderNav();
  renderContent();
  showPage("intro");
  const si=document.getElementById("searchInput");
  let t;
  si.addEventListener("input", e=>{ clearTimeout(t); t=setTimeout(()=>runSearch(e.target.value),140); });
  si.addEventListener("keydown", e=>{ if(e.key==="Escape"){ si.value=""; runSearch(""); } });
  document.getElementById("menuBtn").addEventListener("click", openSidebar);
  document.getElementById("backdrop").addEventListener("click", closeSidebar);
}
document.addEventListener("DOMContentLoaded", init);

</script>
